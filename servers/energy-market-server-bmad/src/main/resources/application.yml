server:
  port: 8086

spring:
  application:
    name: bmad-energy-market-server
  ai:
    mcp:
      server:
        name: bmad-energy-market-server
        version: 1.0.0
        protocol: streamable
        streamable-http:
          mcp-endpoint: /mcp
        capabilities:
          tool: true
          resource: true

logging:
  level:
    org.springframework.ai: INFO
    com.workshop.energy: DEBUG
