<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Mini-Agent Workshop | Glass-Box Observability</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Custom Glass-Box Styles -->
    <link rel="stylesheet" th:href="@{/css/glassbox-agent.css}">
    
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>

    <!-- KaTeX for Math Typesetting -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
</head>
<body class="d-flex flex-column vh-100 overflow-hidden">

    <!-- Top Header -->
    <div th:replace="~{fragments/header :: headerBar}"></div>

    <!-- Main Container -->
    <div class="container-fluid px-4 flex-grow-1 overflow-hidden pb-3">
        <div class="row g-3 h-100 overflow-hidden">
            
            <!-- LEFT PANE: Interactive Agent Chat -->
            <div class="col-lg-6 d-flex flex-column h-100 overflow-hidden">
                <div class="glass-panel d-flex flex-column h-100 overflow-hidden">
                    <div class="p-3 border-bottom border-light-subtle d-flex align-items-center justify-content-between flex-shrink-0 bg-white">
                        <div class="d-flex align-items-center gap-2">
                            <span class="badge bg-primary-subtle text-primary border border-primary-subtle font-mono" th:text="'Session: ' + ${sessionId}">Session: 1234</span>
                            <small class="text-secondary fw-medium">Interactive User Chat</small>
                        </div>
                        <div>
                            <button type="button" 
                                    class="btn btn-sm btn-outline-secondary"
                                    hx-get th:hx-get="@{'/session/' + ${sessionId} + '/transcript/view'}"
                                    hx-target="#logModalBody"
                                    data-bs-toggle="modal" 
                                    data-bs-target="#logViewerModal"
                                    title="View Markdown Audit Transcript">
                                <i class="fa-solid fa-file-lines me-1"></i> Audit Log
                            </button>
                        </div>
                    </div>
                    
                    <!-- Chat Box Fragment -->
                    <div th:replace="~{fragments/chat-panel :: chatContent}"></div>
                </div>
            </div>

            <!-- RIGHT PANE: Under-The-Hood Glass-Box Inspector -->
            <div class="col-lg-6 d-flex flex-column h-100 overflow-hidden">
                <div class="glass-panel d-flex flex-column h-100 overflow-hidden">
                    <!-- Inspector Header & Token Meter -->
                    <div class="p-3 border-bottom border-light-subtle d-flex flex-wrap align-items-center justify-content-between gap-2 flex-shrink-0 bg-white">
                        <div class="d-flex align-items-center gap-2">
                            <div class="spinner-grow spinner-grow-sm text-primary" role="status"></div>
                            <h6 class="mb-0 text-dark fw-bold">
                                <i class="fa-solid fa-microscope text-primary me-1"></i> Under-The-Hood Execution Inspector
                            </h6>
                        </div>
                        
                        <!-- Token & Latency Meter -->
                        <div th:replace="~{fragments/token-meter :: meter}"></div>
                    </div>

                    <!-- Granular ReAct Step Timeline -->
                    <div id="timelineScrollArea" class="timeline-scroll-area flex-grow-1 p-3 bg-light bg-opacity-50">
                        <div th:replace="~{fragments/execution-step :: stepList}"></div>
                    </div>

                    <!-- Footer Info Bar -->
                    <div class="p-2 border-top border-light-subtle bg-light text-center small text-secondary flex-shrink-0">
                        <i class="fa-solid fa-circle-info text-primary me-1"></i>
                        Traces are written to disk at <code>./logs/sessions/<span th:text="${sessionId}">session</span>/</code>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Modals -->
    <div th:replace="~{fragments/tools-drawer :: toolsModal}"></div>
    <div th:replace="~{fragments/tools-drawer :: logModal}"></div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom Reactive Agent JS -->
    <script th:src="@{/js/agent-app.js}"></script>
</body>
</html>
