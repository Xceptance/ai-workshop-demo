<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="headerBar" class="glass-header py-2 px-4 mb-2">
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-3">
        <!-- Logo & Workshop Title -->
        <div class="d-flex align-items-center gap-3">
            <div class="rounded-3 p-2 bg-primary bg-opacity-10 border border-primary border-opacity-25 text-primary">
                <i class="fa-solid fa-microchip fs-4"></i>
            </div>
            <div>
                <h1 class="h5 mb-0 fw-bold text-dark">AI Mini-Agent Workshop</h1>
                <small class="text-secondary">Under-The-Hood Agent Observability & Inspection Platform</small>
            </div>
        </div>

        <!-- Mode Switcher: Classic vs MCP -->
        <div class="d-flex align-items-center bg-light border border-secondary-subtle rounded-pill p-1">
            <a th:href="@{'/?sessionId=' + ${sessionId} + '&mode=classic'}" 
               th:classappend="${mode == null or mode == 'classic'} ? 'btn-primary text-white shadow-sm' : 'text-secondary'"
               class="btn btn-sm rounded-pill px-3 py-1 fw-medium"
               title="In-Process Java Reflection Tool Calling">
                <i class="fa-solid fa-cube me-1"></i> Classic Demo
            </a>
            <a th:href="@{'/?sessionId=' + ${sessionId} + '&mode=mcp'}" 
               th:classappend="${mode == 'mcp'} ? 'btn-dark bg-purple text-white shadow-sm' : 'text-secondary'"
               class="btn btn-sm rounded-pill px-3 py-1 fw-medium"
               title="Out-of-Process Model Context Protocol (JSON-RPC 2.0)">
                <i class="fa-solid fa-network-wired me-1"></i> MCP Demo
            </a>
        </div>

        <!-- Badges & Runtime Status -->
        <div class="d-flex flex-wrap align-items-center gap-2">
            <!-- Active Mode Indicator Badge -->
            <span th:if="${mode == 'mcp'}" class="badge bg-purple-subtle text-purple border border-purple-subtle px-3 py-2 font-mono">
                <i class="fa-solid fa-network-wired me-1"></i> MCP Active
            </span>
            <span th:unless="${mode == 'mcp'}" class="badge bg-primary-subtle text-primary border border-primary-subtle px-3 py-2 font-mono">
                <i class="fa-solid fa-cube me-1"></i> Reflection Active
            </span>

            <!-- Interactive Model & Thinking Level Selector Button -->
            <button type="button" class="btn btn-sm btn-light border border-secondary-subtle d-flex align-items-center gap-2 py-1 px-2 shadow-sm"
                    data-bs-toggle="modal" data-bs-target="#modelSettingsModal"
                    title="Click to switch model or adjust thinking level">
                <i class="fa-solid fa-brain text-primary"></i>
                <span class="font-mono text-dark fw-medium small" th:text="${modelName}">gemini-3.8-flash</span>
                <span class="badge bg-primary-subtle text-primary border border-primary-subtle font-mono text-uppercase px-1 py-0 small"
                      style="font-size: 0.7rem;"
                      th:text="${thinkingLevel != null ? thinkingLevel : 'medium'}">medium</span>
                <i class="fa-solid fa-sliders text-secondary ms-1 small"></i>
            </button>

            <!-- Interactive System Prompt Indicator Badge / Button -->
            <button type="button" class="btn btn-sm btn-light border border-secondary-subtle d-flex align-items-center gap-2 py-1 px-2 shadow-sm"
                    data-bs-toggle="modal" data-bs-target="#newSessionModal"
                    title="Click to view or redefine system prompt for a new session">
                <i class="fa-solid fa-scroll text-primary"></i>
                <span class="font-mono text-dark fw-medium small">Prompt</span>
                <span class="badge font-mono small px-1 py-0"
                      style="font-size: 0.7rem;"
                      th:classappend="${systemPrompt != defaultSystemPrompt} ? 'bg-warning-subtle text-warning-emphasis border border-warning-subtle' : 'bg-primary-subtle text-primary border border-primary-subtle'"
                      th:text="${systemPrompt != defaultSystemPrompt} ? 'Custom' : 'Default'">Default</span>
                <i class="fa-solid fa-sliders text-secondary ms-1 small"></i>
            </button>

            <!-- API Key Source Badge -->
            <span th:if="${apiKeyInfo.isMock()}" class="badge bg-warning-subtle border border-warning-subtle text-warning-emphasis px-3 py-2"
                  title="Running in Offline Mock Mode">
                <i class="fa-solid fa-triangle-exclamation me-1"></i> Offline Mock Mode
            </span>
            <span th:unless="${apiKeyInfo.isMock()}" class="badge bg-success-subtle border border-success-subtle text-success-emphasis px-3 py-2"
                  th:title="'Loaded from ' + ${apiKeyInfo.source()}">
                <i class="fa-solid fa-key me-1"></i> Key Active (<span th:text="${apiKeyInfo.maskedKey()}">***</span>)
            </span>

            <!-- SSE Status Badge -->
            <span id="sseStatusBadge" class="badge bg-primary-subtle text-primary border border-primary-subtle px-3 py-2">
                <i class="fa-solid fa-circle-dot me-1"></i> Live Stream Active
            </span>

            <!-- New Session Button & Dropdown -->
            <div class="btn-group ms-2 shadow-sm">
                <button type="button" class="btn btn-primary btn-sm d-flex align-items-center gap-1"
                        data-bs-toggle="modal" data-bs-target="#newSessionModal"
                        title="Configure &amp; Start a new session (redefine system prompt, model, or mode)">
                    <i class="fa-solid fa-plus me-1"></i> New Session
                </button>
                <button type="button" class="btn btn-primary btn-sm dropdown-toggle dropdown-toggle-split"
                        data-bs-toggle="dropdown" aria-expanded="false" title="Quick session options">
                    <span class="visually-hidden">Toggle Dropdown</span>
                </button>
                <ul class="dropdown-menu dropdown-menu-end shadow border-0 p-2" style="min-width: 250px;">
                    <li>
                        <button type="button" class="dropdown-item rounded d-flex align-items-center gap-2 py-2"
                                data-bs-toggle="modal" data-bs-target="#newSessionModal">
                            <i class="fa-solid fa-sliders text-primary"></i>
                            <div>
                                <span class="d-block fw-semibold text-dark small">Redefine System Prompt...</span>
                                <small class="text-secondary d-block" style="font-size: 0.75rem;">Customize agent instructions &amp; persona</small>
                            </div>
                        </button>
                    </li>
                    <li><hr class="dropdown-divider my-1"></li>
                    <li>
                        <a class="dropdown-item rounded d-flex align-items-center gap-2 py-2"
                           th:href="@{'/?mode=' + ${mode != null ? mode : 'classic'}}">
                            <i class="fa-solid fa-bolt text-warning"></i>
                            <div>
                                <span class="d-block fw-semibold text-dark small">Quick Start (Default Prompt)</span>
                                <small class="text-secondary d-block" style="font-size: 0.75rem;">Direct fresh session with default prompt</small>
                            </div>
                        </a>
                    </li>
                </ul>
            </div>

            <!-- Mode-Specific Inspector Modal Triggers -->
            <button th:if="${mode == 'mcp'}" type="button" class="btn btn-outline-purple btn-sm border-purple text-purple fw-semibold" data-bs-toggle="modal" data-bs-target="#mcpHubModal">
                <i class="fa-solid fa-network-wired me-1 text-purple"></i> MCP Hub (<span id="headerMcpBadgeCount" th:text="${activeMcpServerCount != null ? activeMcpServerCount + '/' + totalMcpServerCount + ' servers, ' + activeMcpToolCount + '/' + totalMcpToolCount + ' tools' : #lists.size(mcpServers) + ' servers'}">2/3 servers, 7/9 tools</span>)
            </button>
            <button th:unless="${mode == 'mcp'}" type="button" class="btn btn-outline-secondary btn-sm" data-bs-toggle="modal" data-bs-target="#toolsModal">
                <i class="fa-solid fa-wrench me-1"></i> Tools (<span id="headerToolsBadgeCount" th:text="${activeToolCount != null ? activeToolCount + '/' + totalToolCount : #lists.size(tools)}">4/4</span>)
            </button>
        </div>
    </div>
</div>
</html>
