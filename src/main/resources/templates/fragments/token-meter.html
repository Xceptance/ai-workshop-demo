<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="meter" id="tokenMeterWrapper" class="d-flex flex-wrap align-items-center gap-2">
    <div class="token-meter-pill badge rounded-pill bg-white border border-secondary-subtle text-dark shadow-sm px-3 py-2" title="Input Tokens sent in prompt">
        <i class="fa-solid fa-arrow-up-right-from-square text-primary me-2"></i>
        <span class="pill-label text-secondary">Prompt: </span>
        <strong class="pill-value text-primary font-mono" th:text="${tokenStats.inputTokens()}">0</strong>
    </div>

    <div class="token-meter-pill badge rounded-pill bg-white border border-secondary-subtle text-dark shadow-sm px-3 py-2" title="Output Tokens generated by model">
        <i class="fa-solid fa-arrow-down-left-and-up-right-to-center text-success me-2"></i>
        <span class="pill-label text-secondary">Completion: </span>
        <strong class="pill-value text-success font-mono" th:text="${tokenStats.outputTokens()}">0</strong>
    </div>

    <div class="token-meter-pill badge rounded-pill bg-white border border-secondary-subtle text-dark shadow-sm px-3 py-2"
         th:title="'Prompt Cache Reused: ' + ${tokenStats.cachedTokens()} + ' tokens (' + ${tokenStats.cacheHitPercentage()} + '% hit rate)'">
        <i class="fa-solid fa-bolt text-info me-2"></i>
        <span class="pill-label text-secondary">Cached: </span>
        <strong class="pill-value text-info font-mono" th:text="${tokenStats.cachedTokens()}">0</strong>
        <span th:if="${tokenStats.cachedTokens() > 0}" class="text-success small fw-bold ms-1" th:text="'(' + ${tokenStats.cacheHitPercentage()} + '%)'">(0%)</span>
    </div>

    <div class="token-meter-pill badge rounded-pill bg-white border border-secondary-subtle text-dark shadow-sm px-3 py-2" title="Total Tokens in session">
        <i class="fa-solid fa-coins text-warning-emphasis me-2"></i>
        <span class="pill-label text-secondary">Total: </span>
        <strong class="pill-value text-warning-emphasis font-mono" th:text="${tokenStats.totalTokens()}">0</strong>
    </div>

    <div class="token-meter-pill badge rounded-pill bg-white border border-secondary-subtle text-dark shadow-sm px-3 py-2" title="Total Model Execution Time">
        <i class="fa-solid fa-stopwatch text-secondary me-2"></i>
        <strong class="pill-value font-mono text-secondary" th:text="${tokenStats.formattedDuration()}">0 ms</strong>
    </div>

    <div class="token-meter-pill badge rounded-pill bg-white border border-secondary-subtle text-dark shadow-sm px-3 py-2" title="Estimated API Cost (USD)">
        <i class="fa-solid fa-dollar-sign text-success me-2"></i>
        <strong class="pill-value font-mono text-success" th:text="${tokenStats.formattedCost()}">$0.0000</strong>
    </div>
</div>
</html>
