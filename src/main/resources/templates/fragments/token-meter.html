<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="meter" id="tokenMeterWrapper" class="d-flex flex-wrap align-items-center gap-2 small">
    <div class="badge bg-white border border-secondary-subtle text-dark p-2 shadow-sm" title="Input Tokens sent in prompt">
        <i class="fa-solid fa-arrow-up-right-from-square text-primary me-1"></i>
        <span class="text-secondary">Prompt: </span>
        <strong class="text-primary font-mono" th:text="${tokenStats.inputTokens()}">0</strong>
    </div>

    <div class="badge bg-white border border-secondary-subtle text-dark p-2 shadow-sm" title="Output Tokens generated by model">
        <i class="fa-solid fa-arrow-down-left-and-up-right-to-center text-success me-1"></i>
        <span class="text-secondary">Completion: </span>
        <strong class="text-success font-mono" th:text="${tokenStats.outputTokens()}">0</strong>
    </div>

    <div class="badge bg-white border border-secondary-subtle text-dark p-2 shadow-sm"
         th:title="'Prompt Cache Reused: ' + ${tokenStats.cachedTokens()} + ' tokens (' + ${tokenStats.cacheHitPercentage()} + '% hit rate)'">
        <i class="fa-solid fa-bolt text-info me-1"></i>
        <span class="text-secondary">Cached: </span>
        <strong class="text-info font-mono" th:text="${tokenStats.cachedTokens()}">0</strong>
        <span th:if="${tokenStats.cachedTokens() > 0}" class="text-success small fw-semibold ms-1" th:text="'(' + ${tokenStats.cacheHitPercentage()} + '%)'">(0%)</span>
    </div>

    <div class="badge bg-white border border-secondary-subtle text-dark p-2 shadow-sm" title="Total Tokens in session">
        <i class="fa-solid fa-coins text-warning-emphasis me-1"></i>
        <span class="text-secondary">Total: </span>
        <strong class="text-warning-emphasis font-mono" th:text="${tokenStats.totalTokens()}">0</strong>
    </div>

    <div class="badge bg-white border border-secondary-subtle text-dark p-2 shadow-sm" title="Total Model Execution Time">
        <i class="fa-solid fa-stopwatch text-secondary me-1"></i>
        <strong class="font-mono text-secondary" th:text="${tokenStats.formattedDuration()}">0 ms</strong>
    </div>

    <div class="badge bg-white border border-secondary-subtle text-dark p-2 shadow-sm" title="Estimated API Cost (USD)">
        <i class="fa-solid fa-dollar-sign text-success me-1"></i>
        <strong class="font-mono text-success" th:text="${tokenStats.formattedCost()}">$0.0000</strong>
    </div>
</div>
</html>
