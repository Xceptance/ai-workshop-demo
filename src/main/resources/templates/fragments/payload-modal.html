<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- Modal: Fullscreen High-Contrast Light Payload Viewer -->
<div th:fragment="payloadModal" class="modal fade" id="payloadViewerModal" tabindex="-1" aria-labelledby="payloadViewerModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-fullscreen modal-dialog-scrollable">
        <div class="modal-content bg-white border text-dark shadow">
            <!-- Modal Header -->
            <div class="modal-header border-bottom border-light-subtle py-2 px-3 bg-light d-flex flex-wrap align-items-center justify-content-between gap-2">
                <div class="d-flex align-items-center gap-2">
                    <i class="fa-solid fa-code text-primary fs-5"></i>
                    <h6 class="modal-title fw-bold text-dark mb-0 font-mono" id="payloadViewerModalLabel">
                        Step Payload Viewer
                    </h6>
                    <span class="badge bg-primary-subtle text-primary border border-primary-subtle font-mono" id="payloadModalBadge">JSON</span>
                    <span class="badge bg-light border text-secondary font-mono small" id="payloadModalStats">0 lines</span>
                </div>

                <div class="d-flex align-items-center gap-2">
                    <!-- Search / Filter in modal -->
                    <div class="input-group input-group-sm" style="width: 220px;">
                        <span class="input-group-text bg-white border-end-0 py-1 text-secondary">
                            <i class="fa-solid fa-magnifying-glass"></i>
                        </span>
                        <input type="text" id="payloadModalSearch" class="form-control border-start-0 py-1" placeholder="Search / Filter...">
                    </div>

                    <!-- Wrap Lines Toggle -->
                    <button type="button" class="btn btn-sm btn-outline-secondary" id="payloadModalWrapBtn" title="Toggle line wrapping">
                        <i class="fa-solid fa-text-width me-1"></i> <span id="payloadModalWrapText">Wrap</span>
                    </button>

                    <!-- Copy Button -->
                    <button type="button" class="btn btn-sm btn-outline-primary" id="payloadModalCopyBtn" title="Copy payload to clipboard">
                        <i class="fa-regular fa-copy me-1"></i> <span id="payloadModalCopyText">Copy</span>
                    </button>

                    <!-- Download Button -->
                    <button type="button" class="btn btn-sm btn-outline-secondary" id="payloadModalDownloadBtn" title="Download payload">
                        <i class="fa-solid fa-download me-1"></i> Download
                    </button>

                    <!-- Close Button -->
                    <button type="button" class="btn-close ms-2" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
            </div>

            <!-- Modal Body -->
            <div class="modal-body p-3 bg-light bg-opacity-25 d-flex flex-column overflow-hidden">
                <div class="payload-fullscreen-container shadow-sm flex-grow-1">
                    <pre class="payload-code-view m-0" id="payloadModalCode"><code id="payloadModalCodeInner"></code></pre>
                </div>
            </div>

            <!-- Modal Footer -->
            <div class="modal-footer border-top border-light-subtle bg-white py-2 px-3 d-flex justify-content-between align-items-center">
                <small class="text-secondary">
                    <i class="fa-solid fa-circle-info text-primary me-1"></i>
                    Press <kbd class="bg-light text-dark border">Esc</kbd> to close overlay. Fullscreen Light Mode enabled.
                </small>
                <button type="button" class="btn btn-secondary btn-sm px-3" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>
</html>
